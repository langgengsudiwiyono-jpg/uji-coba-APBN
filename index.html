        opts: ["Menteri Keuangan", "Menteri/Pimpinan Lembaga terkait", "Dirjen Anggaran", "Direktur Bendahara Umum Negara"],
        answer: 1,
        exp: "Menteri/Pimpinan Lembaga adalah Pengguna Anggaran (PA) untuk K/L yang dipimpinnya."
    },
    {
        type: "pg",
        q: "Asas APBN yang menghendaki agar semua penerimaan dan pengeluaran dicantumkan secara lengkap dalam dokumen anggaran adalah...",
        opts: ["Asas Tahunan", "Asas Universalitas", "Asas Spesifisitas", "Asas Akuntabilitas"],
        answer: 1,
        exp: "Asas Universalitas menggariskan agar penerimaan dan pengeluaran ditampilkan utuh/bruto."
    },
    {
        type: "pg",
        q: "Asas APBN yang menghendaki bahwa kredit anggaran harus ditujukan secara khusus untuk jenis pengeluaran tertentu adalah...",
        opts: ["Asas Tahunan", "Asas Universalitas", "Asas Spesifisitas", "Asas Tranparansi"],
        answer: 2,
        exp: "Asas Spesifisitas membatasi penggunaan anggaran sesuai rincian peruntukannya."
    },
    {
        type: "pg",
        q: "Pernyataan akuntansi pemerintah di Indonesia disusun berdasar standar resmi yaitu...",
        opts: ["PSAK", "SAP (Standar Akuntansi Pemerintahan)", "IFRS", "SPAP"],
        answer: 1,
        exp: "Pemerintah menggunakan SAP yang ditetapkan dengan Peraturan Pemerintah."
    },
    {
        type: "pg",
        q: "Akuntansi berbasis akrual pada laporan keuangan pemerintah mulai diwajibkan secara penuh sejak tahun...",
        opts: ["2003", "2008", "2015", "2020"],
        answer: 2,
        exp: "Penerapan Standar Akuntansi Pemerintahan Berbasis Akrual secara penuh dilaksanakan mulai tahun anggaran 2015."
    },
    {
        type: "pg",
        q: "Instrumen pembiayaan obligasi negara yang menggunakan prinsip syariah disebut...",
        opts: ["SUN", "SBSN / Sukuk Negara", "Ori", "SBR"],
        answer: 1,
        exp: "SBSN (Surat Berharga Syariah Negara) atau Sukuk Negara diterbitkan berdasarkan prinsip syariah."
    }
];

let currentQuestionIndex = 0;
let userAnswers = [];

function loadQuestion() {
    const q = questions[currentQuestionIndex];
    document.getElementById('question-number').innerText = `Soal ${currentQuestionIndex + 1} dari ${questions.length}`;
    document.getElementById('next-btn').style.display = 'none';
    
    const statementBox = document.getElementById('statement-container');
    const questionText = document.getElementById('question-text');
    const optionsBox = document.getElementById('options-container');
    
    statementBox.innerHTML = '';
    optionsBox.innerHTML = '';

    if (q.type === "sa") {
        questionText.innerText = "Pilihlah hubungan antara pernyataan dan alasan berikut:";
        statementBox.innerHTML = `
            <div class="statement-box">
                <p><strong>Pernyataan:</strong> ${q.s1}</p>
                <p style="text-align:center; font-weight:bold; margin:12px 0; color:#e74c3c;">SEBAB</p>
                <p><strong>Alasan:</strong> ${q.s2}</p>
            </div>
        `;
        optSebabAkibat.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(index);
            optionsBox.appendChild(btn);
        });
    } else {
        questionText.innerText = q.q;
        q.opts.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(index);
            optionsBox.appendChild(btn);
        });
    }
}

function selectOption(index) {
    userAnswers[currentQuestionIndex] = index;
    const buttons = document.querySelectorAll('.option-btn');
    buttons.forEach((btn, idx) => {
        btn.style.backgroundColor = idx === index ? '#d4edda' : '#fff';
        btn.style.borderColor = idx === index ? '#28a745' : '#ccc';
    });
    document.getElementById('next-btn').style.display = 'block';
}

function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-box').style.display = 'none';
    document.getElementById('result-box').style.display = 'block';

    let score = 0;
    const reviewBox = document.getElementById('review-container');
    reviewBox.innerHTML = '';

    questions.forEach((q, index) => {
        const isCorrect = userAnswers[index] === q.answer;
        if (isCorrect) score++;

        const reviewItem = document.createElement('div');
        reviewItem.className = 'review-item';
        
        let qText = q.type === "sa" ? `Soal ${index + 1} (Sebab-Akibat)` : `Soal ${index + 1}: ${q.q}`;
        let selectedText = q.type === "sa" ? optSebabAkibat[userAnswers[index]] : q.opts[userAnswers[index]];
        let correctText = q.type === "sa" ? optSebabAkibat[q.answer] : q.opts[q.answer];
        
        reviewItem.innerHTML = `
            <p><strong>${qText}</strong></p>
            <p>Jawaban Kamu: <span class="${isCorrect ? 'correct' : 'wrong'}">${selectedText || 'Tidak dijawab'}</span></p>
            ${!isCorrect ? `<p>Jawaban Benar: <span class="correct">${correctText}</span></p>` : ''}
            <div class="explanation"><strong>Pembahasan:</strong> ${q.exp}</div>
        `;
        reviewBox.appendChild(reviewItem);
    });

    const finalScore = Math.round((score / questions.length) * 100);
    document.getElementById('score-board').innerText = `Skor Akhir: ${finalScore} / 100 (${score} dari ${questions.length} Soal Benar)`;
}

function restartQuiz() {
    currentQuestionIndex = 0;
    userAnswers = [];
    document.getElementById('quiz-box').style.display = 'block';
    document.getElementById('result-box').style.display = 'none';
    loadQuestion();
}

loadQuestion();
</script>
